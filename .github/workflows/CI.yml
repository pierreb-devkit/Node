name: CI

on:
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    container: node:lts
    timeout-minutes: 15

    services:
      mongo:
        image: mongo:7

    env:
      DEVKIT_NODE_db_uri: mongodb://mongo:27017/NodeTest

    steps:
      - uses: actions/checkout@v4

      - run: npm ci

      - run: npm run lint

      - run: npm run test:coverage
