name: CI

on:
  push:
    branches: [master, main]
    paths-ignore:
      - '**/*.md'
      - 'documentation/**'
      - '.claude/**'
  pull_request:
    branches: [master, main]
    paths-ignore:
      - '**/*.md'
      - 'documentation/**'
      - '.claude/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration, e2e]
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: ${{ vars.APP_ENV || 'test' }}
      DEVKIT_NODE_db_uri: ${{ secrets.MONGO_URI || vars.MONGO_URI || 'mongodb://localhost:27017/NodeTest' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint (once on the unit job)
        if: matrix.suite == 'unit'
        run: npm run lint

      - name: Run tests
        run: |
          case "${{ matrix.suite }}" in
            unit|integration)
              npm run test:${{ matrix.suite }}:coverage
              ;;
            e2e)
              npm run test:e2e
              ;;
          esac

      - name: Upload coverage
        if: "!cancelled() && matrix.suite != 'e2e' && env.CODECOV_TOKEN != ''"
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe  # v5.5.4
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ matrix.suite }}
          slug: ${{ github.repository }}

