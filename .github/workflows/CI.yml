name: CI

on:
  push:
    branches: [master, main]
    paths-ignore:
      - '**/*.md'
      - 'documentation/**'
      - '.claude/**'
  pull_request:
    branches: [master, main]
    paths-ignore:
      - '**/*.md'
      - 'documentation/**'
      - '.claude/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration, e2e]
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: ${{ vars.APP_ENV || 'test' }}
      DEVKIT_NODE_db_uri: ${{ secrets.MONGO_URI || vars.MONGO_URI || 'mongodb://localhost:27017/NodeTest' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Lint (once on the unit job)
        if: matrix.suite == 'unit'
        run: npm run lint

      - name: Run tests
        run: |
          case "${{ matrix.suite }}" in
            unit|integration)
              npm run test:${{ matrix.suite }}:coverage
              ;;
            e2e)
              npm run test:e2e
              ;;
          esac

      - name: Upload coverage
        if: matrix.suite != 'e2e'
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe  # v5.5.4
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ matrix.suite }}
          slug: ${{ github.repository }}

  parallel-smoke:
    # Regression gate for #3515 — proves the per-pid test DB default keeps
    # multiple jest processes isolated against a single shared mongod.
    # Off the critical path (not a `needs:` of any merge gate), so a slow
    # smoke never blocks PR merges.
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      # Intentionally NO DEVKIT_NODE_db_uri override here — we need the
      # per-pid default in config/defaults/test.config.js to apply, since
      # that's exactly what the smoke is gating.

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - run: npm run test:parallel-smoke
        env:
          SMOKE_WORKERS: 2
          SMOKE_TIMEOUT_MS: 300000
