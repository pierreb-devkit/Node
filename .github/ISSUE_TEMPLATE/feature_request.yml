name: Feature request
description: Suggest an idea for this project
title: 'feat(context): title'
labels: ['Feat']
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, please [search existing issues](../../issues) to avoid duplicates.

  - type: textarea
    id: problem
    attributes:
      label: Problem description
      description: What problem does this feature solve? What are you trying to do?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What must be true for this feature to be considered complete?
      placeholder: |
        - [ ]
        - [ ]

  - type: dropdown
    id: effort
    attributes:
      label: Estimated effort
      options:
        - 'Effort easy (h)'
        - 'Effort medium (d)'
        - 'Effort hard (w)'

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or features you've considered.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, mockups, or any other relevant information.
