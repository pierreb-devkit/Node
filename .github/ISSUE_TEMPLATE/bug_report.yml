name: Bug report
description: Create a report to help us improve
title: 'fix(context): title'
labels: ['Fix']
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, please [search existing issues](../../issues) to avoid duplicates.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - 'Severity1: confusing'
        - 'Severity2: inconvenient'
        - 'Severity3: broken'
        - 'Severity4: regression'
        - 'Severity5: access/security'
    validations:
      required: true

  - type: dropdown
    id: effort
    attributes:
      label: Estimated effort to fix
      options:
        - 'Effort easy (h)'
        - 'Effort medium (d)'
        - 'Effort hard (w)'

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: 'Node version, OS, relevant config'
      placeholder: |
        - Node: x.x.x
        - OS: macOS / Linux / Windows
        - Stack version:

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, logs, or any other relevant information.
