openapi: '3.0.0'
info:
  version: '1.0.0'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Authenticate by sending an HTTP `Authorization: Bearer <token>` header.
    apiKeyAuth:
      type: http
      scheme: bearer
      description: |
        Legacy alias for `bearerAuth`. New integrations should use `bearerAuth`.

  schemas:
    SuccessResponse:
      type: object
      description: Standard success envelope. data type varies by endpoint.
      properties:
        type:
          type: string
          enum:
            - success
        message:
          type: string
        data:
          description: Response payload (type varies by endpoint)

    ErrorResponse:
      type: object
      description: Standard error envelope returned on 4xx/5xx.
      properties:
        type:
          type: string
          enum:
            - error
        message:
          type: string
        code:
          type: integer
        status:
          type: integer
        errorCode:
          type: string
        description:
          type: string
        error:
          type: string
          description: JSON-stringified error details included only in non-production environments.

  responses:
    Unauthorized:
      description: Missing or invalid JWT token — Passport JWT middleware returns 401 with an empty body (no JSON envelope)

    Forbidden:
      description: Insufficient permissions (CASL policy denied)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    UnprocessableEntity:
      description: Validation or business logic error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
