openapi: '3.0.0'
info:
  version: '1.0.0'
servers:
  - url: 'http://localhost:3000'
components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"

  schemas:
    SuccessResponse:
      type: object
      properties:
        type:
          type: string
          enum:
            - success
        message:
          type: string
        data:
          description: Response payload (type varies by endpoint)

    ErrorResponse:
      type: object
      properties:
        type:
          type: string
          enum:
            - error
        message:
          type: string
        code:
          type: integer
        status:
          type: integer
        errorCode:
          type: string
        description:
          type: string

  responses:
    Unauthorized:
      description: Missing or invalid JWT token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: Insufficient permissions (CASL policy denied)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    UnprocessableEntity:
      description: Validation or business logic error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
