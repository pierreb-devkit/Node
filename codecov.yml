coverage:
  status:
    project:
      default:
        target: 80%        # hard floor — prevents long-term coverage decay (auto allows drift)
        threshold: 0.5%    # allow ≤0.5% transient drop within the 80% floor
        flags:
          - unit
          - integration
    patch:
      default:
        target: auto       # new code must match local module baseline (not abstract 80%)
        threshold: 0%      # no tolerance on new code
        flags:
          - unit
          - integration

flags:
  unit:
    paths:
      - lib
      - modules
      - config
  integration:
    paths:
      - lib
      - modules
      - config

comment:
  layout: "header, diff, flags, components, footer"
  behavior: default
  require_changes: false

# Wait for both flags to upload before posting status
codecov:
  notify:
    after_n_builds: 2
